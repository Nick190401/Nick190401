<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Nick Kleinjohann — Software Engineer</title>
  <desc id="description">An engineering mission-control header with an animated neutron-star system map.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050607" />
      <stop offset="0.58" stop-color="#0a0b0c" />
      <stop offset="1" stop-color="#070809" />
    </linearGradient>
    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.22" stop-color="#eeeeee" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" />
      <stop offset="1" stop-color="#aeb3b7" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.035" />
    </pattern>
    <filter id="soft-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="20" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .orbit-motion { transform-origin: 943px 196px; animation: orbit 18s linear infinite; }
    .orbit-motion-reverse { transform-origin: 943px 196px; animation: orbit 12s linear infinite reverse; }
    .signal-motion { animation: signal 5s ease-in-out infinite; }
    .pulse-motion { animation: pulse 2.4s ease-in-out infinite; }
    .dash-motion { animation: dash 7s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes signal { 0%, 100% { transform: translateX(-360px) skewX(-18deg); opacity: 0; } 20%, 80% { opacity: .55; } 50% { transform: translateX(1500px) skewX(-18deg); opacity: .9; } }
    @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -160; } }
    @media (prefers-reduced-motion: reduce) {
      .orbit-motion, .orbit-motion-reverse, .signal-motion, .pulse-motion, .dash-motion { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)" />
    <rect width="1200" height="360" fill="url(#grid)" />
    <rect class="signal-motion" x="-240" y="0" width="300" height="360" fill="url(#signal)" opacity="0.3" />

    <path d="M 0 84 H 1200" stroke="#ffffff" stroke-opacity="0.1" />
    <path d="M 744 84 V 356" stroke="#ffffff" stroke-opacity="0.1" />

    <g class="mono" font-size="12" letter-spacing="2.2">
      <circle class="pulse-motion" cx="58" cy="42" r="5" fill="#f2f2f2" />
      <text x="74" y="47" fill="#f2f2f2">SYSTEM ONLINE</text>
      <text x="1142" y="47" text-anchor="end" fill="#717579">0day/pwned @ NEUTRON STAR</text>
    </g>

    <g transform="translate(58 136)">
      <text class="sans" x="0" y="0" fill="#f4f4f4" font-size="24" font-weight="650" letter-spacing="3">NICK</text>
      <text class="sans" x="0" y="78" fill="#f4f4f4" font-size="74" font-weight="760" letter-spacing="2">KLEINJOHANN</text>
      <rect x="2" y="106" width="74" height="2" fill="#f2f2f2" />
      <text class="mono" x="92" y="112" fill="#929699" font-size="15" letter-spacing="3.2">SOFTWARE DEVELOPER</text>
      <text class="mono" x="2" y="157" fill="#f2f2f2" font-size="12" letter-spacing="2.1">BUILD PRODUCTS / OWN SYSTEMS / BREAK ASSUMPTIONS</text>
    </g>

    <g aria-label="System map">
      <circle cx="943" cy="196" r="122" fill="none" stroke="#ffffff" stroke-opacity="0.08" />
      <circle cx="943" cy="196" r="86" fill="none" stroke="#aeb3b7" stroke-opacity="0.12" stroke-dasharray="3 8" />
      <circle cx="943" cy="196" r="49" fill="none" stroke="#ffffff" stroke-opacity="0.18" />

      <g class="orbit-motion">
        <ellipse cx="943" cy="196" rx="151" ry="56" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-dasharray="7 11" />
        <circle cx="1094" cy="196" r="7" fill="#f2f2f2" />
      </g>
      <g class="orbit-motion-reverse">
        <ellipse cx="943" cy="196" rx="72" ry="145" fill="none" stroke="#aeb3b7" stroke-opacity="0.24" stroke-dasharray="2 10" />
        <circle cx="943" cy="51" r="5" fill="#aeb3b7" />
      </g>

      <path class="dash-motion" d="M 804 263 C 850 328 1038 326 1090 255" fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="1.5" stroke-dasharray="12 8" />
      <circle cx="943" cy="196" r="34" fill="url(#star)" filter="url(#soft-glow)" opacity="0.75" />
      <circle class="pulse-motion" cx="943" cy="196" r="8" fill="#f4f4f4" />

      <g class="mono" font-size="10" letter-spacing="1.8" fill="#929699">
        <text x="781" y="290">INPUT / IDEA</text>
        <text x="1032" y="290">OUTPUT / PRODUCT</text>
        <text x="943" y="199" text-anchor="middle" fill="#070809" font-size="7" font-weight="700">NK</text>
      </g>
    </g>

  </g>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.14" />
</svg>
