<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="title description">
  <title id="title">Engineering manifest</title>
  <desc id="description">Three animated engineering principles covering product delivery, low-level systems, and security.</desc>

  <defs>
    <linearGradient id="manifest-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#0c1015" />
    </linearGradient>
    <linearGradient id="active-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="manifest-glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .scanner { animation: scan 7s ease-in-out infinite; }
    .status-a { animation: pulse 3.6s ease-in-out infinite; }
    .status-b { animation: pulse 3.6s 1.2s ease-in-out infinite; }
    .status-c { animation: pulse 3.6s 2.4s ease-in-out infinite; }
    @keyframes scan { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(166px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 30%, 55% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .scanner, .status-a, .status-b, .status-c { animation: none; }
    }
  </style>

  <rect width="1200" height="304" rx="14" fill="url(#manifest-bg)" />
  <rect x="0.5" y="0.5" width="1199" height="303" rx="13.5" fill="none" stroke="#30363d" />

  <g class="mono" font-size="10" letter-spacing="2">
    <text x="42" y="34" fill="#777b7e">ENGINEERING MANIFEST / 03</text>
    <text x="1158" y="34" text-anchor="end" fill="#f2f2f2">STATUS / OPERATIONAL</text>
  </g>

  <path d="M 92 72 V 240" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <g class="scanner">
    <circle cx="92" cy="74" r="13" fill="#ffffff" opacity="0.13" filter="url(#manifest-glow)" />
    <circle cx="92" cy="74" r="4" fill="#f2f2f2" />
    <rect x="108" y="73" width="148" height="1" fill="url(#active-line)" />
  </g>

  <path d="M 42 132 H 1158 M 42 216 H 1158" stroke="#ffffff" stroke-opacity="0.07" />

  <g transform="translate(42 78)">
    <text class="mono" x="0" y="9" fill="#f2f2f2" font-size="12" letter-spacing="2">01</text>
    <text class="sans" x="92" y="10" fill="#f4f4f4" font-size="22" font-weight="720">SHIP THE WHOLE PRODUCT</text>
    <text class="mono" x="92" y="34" fill="#777b7e" font-size="10" letter-spacing="1.6">INTERFACE · API · DATA · DELIVERY</text>
    <circle class="status-a" cx="1020" cy="6" r="4" fill="#f2f2f2" />
    <text class="mono" x="1116" y="10" text-anchor="end" fill="#f2f2f2" font-size="10" letter-spacing="1.7">END TO END</text>
  </g>

  <g transform="translate(42 162)">
    <text class="mono" x="0" y="9" fill="#f2f2f2" font-size="12" letter-spacing="2">02</text>
    <text class="sans" x="92" y="10" fill="#f4f4f4" font-size="22" font-weight="720">GO BELOW THE ABSTRACTION</text>
    <text class="mono" x="92" y="34" fill="#777b7e" font-size="10" letter-spacing="1.6">C++ · MEMORY · BINARIES · NATIVE SYSTEMS</text>
    <circle class="status-b" cx="1020" cy="6" r="4" fill="#f2f2f2" />
    <text class="mono" x="1116" y="10" text-anchor="end" fill="#f2f2f2" font-size="10" letter-spacing="1.7">LOW LEVEL</text>
  </g>

  <g transform="translate(42 246)">
    <text class="mono" x="0" y="9" fill="#f2f2f2" font-size="12" letter-spacing="2">03</text>
    <text class="sans" x="92" y="10" fill="#f4f4f4" font-size="22" font-weight="720">TRUST NOTHING BY DEFAULT</text>
    <text class="mono" x="92" y="34" fill="#777b7e" font-size="10" letter-spacing="1.6">AUTHORIZATION · ATTACK SURFACE · FAILURE PATHS</text>
    <circle class="status-c" cx="1020" cy="6" r="4" fill="#f2f2f2" />
    <text class="mono" x="1116" y="10" text-anchor="end" fill="#f2f2f2" font-size="10" letter-spacing="1.7">HARDENED</text>
  </g>
</svg>
