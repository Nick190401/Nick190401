<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title description">
  <title id="title">Software development signal path</title>
  <desc id="description">An animated path across product development, native systems, reverse engineering, and security.</desc>

  <defs>
    <linearGradient id="rail-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070809" />
      <stop offset="0.5" stop-color="#0b0c0d" />
      <stop offset="1" stop-color="#070809" />
    </linearGradient>
    <linearGradient id="path-color" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.5" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16" />
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.28" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .trace { animation: trace 6s linear infinite; }
    .node-a { animation: node 4s ease-in-out infinite; }
    .node-b { animation: node 4s 1s ease-in-out infinite; }
    .node-c { animation: node 4s 2s ease-in-out infinite; }
    .node-d { animation: node 4s 3s ease-in-out infinite; }
    @keyframes trace { to { stroke-dashoffset: -180; } }
    @keyframes node { 0%, 100% { opacity: .35; } 35%, 55% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .node-a, .node-b, .node-c, .node-d { animation: none; }
    }
  </style>

  <rect width="1200" height="190" rx="14" fill="url(#rail-bg)" />
  <rect x="0.5" y="0.5" width="1199" height="189" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" />

  <g class="mono" font-size="10" letter-spacing="2">
    <text x="42" y="34" fill="#777b7e">SIGNAL PATH / ACTIVE</text>
    <text x="1158" y="34" text-anchor="end" fill="#f2f2f2">TRACE 0x0DA7</text>
  </g>

  <path d="M 96 90 H 1104" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <path class="trace" d="M 96 90 H 1104" stroke="url(#path-color)" stroke-width="2" stroke-dasharray="18 14" />

  <g class="mono" text-anchor="middle">
    <g>
      <circle class="node-a" cx="140" cy="90" r="18" fill="url(#pulse)" filter="url(#glow)" opacity="0.7" />
      <circle cx="140" cy="90" r="5" fill="#f2f2f2" />
      <text x="140" y="69" fill="#777b7e" font-size="9" letter-spacing="1.6">FULL-STACK / WEB</text>
      <text class="sans" x="140" y="132" fill="#f4f4f4" font-size="23" font-weight="720">PRODUCT</text>
    </g>

    <g>
      <circle class="node-b" cx="447" cy="90" r="18" fill="url(#pulse)" filter="url(#glow)" opacity="0.7" />
      <circle cx="447" cy="90" r="5" fill="#f2f2f2" />
      <text x="447" y="69" fill="#777b7e" font-size="9" letter-spacing="1.6">C++ / NATIVE</text>
      <text class="sans" x="447" y="132" fill="#f4f4f4" font-size="23" font-weight="720">SYSTEMS</text>
    </g>

    <g>
      <circle class="node-c" cx="753" cy="90" r="18" fill="url(#pulse)" filter="url(#glow)" opacity="0.7" />
      <circle cx="753" cy="90" r="5" fill="#f2f2f2" />
      <text x="753" y="69" fill="#777b7e" font-size="9" letter-spacing="1.6">TRACE / UNDERSTAND</text>
      <text class="sans" x="753" y="132" fill="#f4f4f4" font-size="19" font-weight="720">REVERSE ENGINEERING</text>
    </g>

    <g>
      <circle class="node-d" cx="1060" cy="90" r="18" fill="url(#pulse)" filter="url(#glow)" opacity="0.7" />
      <circle cx="1060" cy="90" r="5" fill="#f2f2f2" />
      <text x="1060" y="69" fill="#777b7e" font-size="9" letter-spacing="1.6">BREAK / HARDEN</text>
      <text class="sans" x="1060" y="132" fill="#f4f4f4" font-size="23" font-weight="720">SECURITY</text>
    </g>
  </g>

  <text class="mono" x="600" y="169" text-anchor="middle" fill="#5f6366" font-size="9" letter-spacing="2.2">SHIP THE PRODUCT · OWN THE SYSTEM · BREAK THE ASSUMPTION</text>
</svg>
