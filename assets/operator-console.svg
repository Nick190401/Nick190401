<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Nick's operator console</title>
  <desc id="description">An animated security and reverse-engineering capability console.</desc>

  <defs>
    <linearGradient id="console-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b0d" />
      <stop offset="1" stop-color="#0a1210" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73f7bf" stop-opacity="0" />
      <stop offset="0.5" stop-color="#73f7bf" stop-opacity="0.7" />
      <stop offset="1" stop-color="#73f7bf" stop-opacity="0" />
    </linearGradient>
    <pattern id="micro-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#d8fff0" stroke-opacity="0.025" />
    </pattern>
    <clipPath id="stream-window">
      <rect x="496" y="118" width="266" height="188" rx="6" />
    </clipPath>
    <clipPath id="ticker-window">
      <rect x="30" y="362" width="1140" height="48" rx="6" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .pulse-a { animation: pulse 2.8s ease-in-out infinite; }
    .pulse-b { animation: pulse 2.8s .7s ease-in-out infinite; }
    .pulse-c { animation: pulse 2.8s 1.4s ease-in-out infinite; }
    .pulse-d { animation: pulse 2.8s 2.1s ease-in-out infinite; }
    .stream { animation: stream 7s linear infinite; }
    .trace { animation: trace 4s linear infinite; }
    .scanline { animation: scanline 6s ease-in-out infinite; }
    .ticker { animation: ticker 18s linear infinite; }
    .blink { animation: blink 1.15s steps(2, end) infinite; }
    @keyframes pulse { 0%, 100% { opacity: .35; } 35%, 60% { opacity: 1; } }
    @keyframes stream { to { transform: translateY(-144px); } }
    @keyframes trace { to { stroke-dashoffset: -260; } }
    @keyframes scanline { 0%, 100% { transform: translateX(-350px); opacity: 0; } 20%, 80% { opacity: .55; } 50% { transform: translateX(1500px); opacity: .9; } }
    @keyframes ticker { to { transform: translateX(-1200px); } }
    @keyframes blink { 50% { opacity: .2; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse-a, .pulse-b, .pulse-c, .pulse-d, .stream, .trace, .scanline, .ticker, .blink { animation: none; }
    }
  </style>

  <rect width="1200" height="430" rx="18" fill="url(#console-bg)" />
  <rect width="1200" height="430" rx="18" fill="url(#micro-grid)" />
  <rect class="scanline" x="-260" width="180" height="430" fill="url(#scan)" transform="skewX(-16)" opacity="0.45" />
  <rect x="0.5" y="0.5" width="1199" height="429" rx="17.5" fill="none" stroke="#d8fff0" stroke-opacity="0.14" />

  <g class="mono">
    <path d="M 0 58 H 1200" stroke="#d8fff0" stroke-opacity="0.1" />
    <circle cx="30" cy="29" r="4" fill="#73f7bf" />
    <circle cx="46" cy="29" r="4" fill="#ffb86b" opacity="0.65" />
    <circle cx="62" cy="29" r="4" fill="#73d3f7" opacity="0.65" />
    <text x="84" y="35" fill="#d8fff0" font-size="13" font-weight="700" letter-spacing="2.1">NK // OPERATOR CONSOLE</text>
    <text x="1168" y="35" text-anchor="end" fill="#73f7bf" font-size="12" letter-spacing="1.7">0day/pwned · ACTIVE</text>
  </g>

  <g>
    <rect x="30" y="78" width="438" height="264" rx="10" fill="#0c1214" stroke="#d8fff0" stroke-opacity="0.1" />
    <text class="mono" x="52" y="105" fill="#71817a" font-size="10" letter-spacing="2">LIVE / OPERATOR FEED</text>

    <g transform="translate(52 132)">
      <g class="pulse-a">
        <circle cx="5" cy="4" r="5" fill="#73f7bf" />
        <text class="sans" x="24" y="9" fill="#f4fff9" font-size="17" font-weight="680">Full-stack systems</text>
        <text class="mono" x="24" y="29" fill="#71817a" font-size="10" letter-spacing="1.4">INTERFACES ↔ INFRASTRUCTURE</text>
      </g>
      <g class="pulse-b" transform="translate(0 58)">
        <circle cx="5" cy="4" r="5" fill="#ffb86b" />
        <text class="sans" x="24" y="9" fill="#f4fff9" font-size="17" font-weight="680">Application security</text>
        <text class="mono" x="24" y="29" fill="#71817a" font-size="10" letter-spacing="1.4">TRUST BOUNDARIES / ATTACK SURFACE</text>
      </g>
      <g class="pulse-c" transform="translate(0 116)">
        <circle cx="5" cy="4" r="5" fill="#73d3f7" />
        <text class="sans" x="24" y="9" fill="#f4fff9" font-size="17" font-weight="680">Reverse engineering</text>
        <text class="mono" x="24" y="29" fill="#71817a" font-size="10" letter-spacing="1.4">TRACE / INSPECT / UNDERSTAND</text>
      </g>
      <g class="pulse-d" transform="translate(0 174)">
        <circle cx="5" cy="4" r="5" fill="#baffdf" />
        <text class="sans" x="24" y="9" fill="#f4fff9" font-size="17" font-weight="680">AI + automation</text>
        <text class="mono" x="24" y="29" fill="#71817a" font-size="10" letter-spacing="1.4">ZERO BUSYWORK / REPEATABLE SYSTEMS</text>
      </g>
    </g>
  </g>

  <g>
    <rect x="480" y="78" width="300" height="264" rx="10" fill="#0c1214" stroke="#d8fff0" stroke-opacity="0.1" />
    <text class="mono" x="500" y="105" fill="#71817a" font-size="10" letter-spacing="2">TRACE / SIGNAL ANALYSIS</text>
    <rect x="496" y="118" width="266" height="188" rx="6" fill="#07100d" stroke="#73f7bf" stroke-opacity="0.12" />

    <g clip-path="url(#stream-window)" class="mono" font-size="10" letter-spacing="1.1">
      <g class="stream" fill="#4f7767">
        <text x="508" y="139">0x7FF6  PUSH RBP     ; ENTRY</text>
        <text x="508" y="163">0x7FF8  MOV  RAX,RSP ; TRACE</text>
        <text x="508" y="187" fill="#73d3f7">0x8000  XOR  EDX,EDX ; ZERO</text>
        <text x="508" y="211">0x8004  CALL 0x1337  ; INSPECT</text>
        <text x="508" y="235" fill="#ffb86b">0x8009  JNZ  0x0DA7  ; 0DAY</text>
        <text x="508" y="259">0x8010  CMP  RAX,01  ; VERIFY</text>
        <text x="508" y="283" fill="#73f7bf">0x8014  RET           ; SHIP</text>
        <text x="508" y="307">0x8018  PUSH RBP     ; ENTRY</text>
        <text x="508" y="331">0x8020  MOV  RAX,RSP ; TRACE</text>
        <text x="508" y="355" fill="#73d3f7">0x8024  XOR  EDX,EDX ; ZERO</text>
        <text x="508" y="379">0x8028  CALL 0x1337  ; INSPECT</text>
        <text x="508" y="403" fill="#ffb86b">0x802D  JNZ  0x0DA7  ; 0DAY</text>
        <text x="508" y="427">0x8034  CMP  RAX,01  ; VERIFY</text>
      </g>
    </g>

    <path class="trace" d="M 498 322 C 516 321 520 313 531 322 S 548 332 558 322 S 575 274 586 322 S 601 335 612 322 S 631 306 642 322 S 658 331 668 322 S 684 286 697 322 S 717 327 728 322 S 746 315 760 322" fill="none" stroke="#73f7bf" stroke-width="2" stroke-dasharray="10 8" />
  </g>

  <g>
    <rect x="792" y="78" width="378" height="264" rx="10" fill="#0c1214" stroke="#d8fff0" stroke-opacity="0.1" />
    <text class="mono" x="814" y="105" fill="#71817a" font-size="10" letter-spacing="2">RUNTIME / FLAGS</text>

    <g class="mono" font-size="12" letter-spacing="1.5">
      <g transform="translate(814 140)">
        <text fill="#d8fff0">SECURITY</text>
        <path d="M 0 14 H 330" stroke="#d8fff0" stroke-opacity="0.07" />
        <text x="330" text-anchor="end" fill="#73f7bf">ONLINE</text>
        <circle class="blink" cx="250" cy="-4" r="3" fill="#73f7bf" />
      </g>
      <g transform="translate(814 190)">
        <text fill="#d8fff0">REVERSE ENGINEERING</text>
        <path d="M 0 14 H 330" stroke="#d8fff0" stroke-opacity="0.07" />
        <text x="330" text-anchor="end" fill="#73d3f7">TRACING</text>
        <circle class="blink" cx="250" cy="-4" r="3" fill="#73d3f7" />
      </g>
      <g transform="translate(814 240)">
        <text fill="#d8fff0">SYSTEMS</text>
        <path d="M 0 14 H 330" stroke="#d8fff0" stroke-opacity="0.07" />
        <text x="330" text-anchor="end" fill="#73f7bf">SHIP MODE</text>
        <circle class="blink" cx="250" cy="-4" r="3" fill="#73f7bf" />
      </g>
      <g transform="translate(814 290)">
        <text fill="#d8fff0">0DAY MINDSET</text>
        <path d="M 0 14 H 330" stroke="#d8fff0" stroke-opacity="0.07" />
        <text x="330" text-anchor="end" fill="#ffb86b">ARMED</text>
        <circle class="blink" cx="250" cy="-4" r="3" fill="#ffb86b" />
      </g>
    </g>
  </g>

  <g clip-path="url(#ticker-window)">
    <rect x="30" y="362" width="1140" height="48" rx="6" fill="#07100d" stroke="#73f7bf" stroke-opacity="0.12" />
    <g class="ticker mono" fill="#9fb0a8" font-size="12" letter-spacing="2.1">
      <text x="55" y="392">TYPESCRIPT · REACT · NEXT.JS · NODE.JS · PYTHON · C++ · SUPABASE · POSTGRESQL · DOCKER · GITHUB ACTIONS ·</text>
      <text x="1255" y="392">TYPESCRIPT · REACT · NEXT.JS · NODE.JS · PYTHON · C++ · SUPABASE · POSTGRESQL · DOCKER · GITHUB ACTIONS ·</text>
    </g>
  </g>
</svg>
