<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="title description">
  <title id="title">Technology and engineering ticker</title>
  <desc id="description">Three animated rows listing product technologies, native systems, and runtime-analysis tools.</desc>

  <defs>
    <linearGradient id="ticker-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="0.5" stop-color="#0c1015" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .row-a { animation: row 5.4s ease-in-out infinite; }
    .row-b { animation: row 5.4s 1.8s ease-in-out infinite; }
    .row-c { animation: row 5.4s 3.6s ease-in-out infinite; }
    @keyframes row { 0%, 100% { opacity: .58; } 35%, 60% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .row-a, .row-b, .row-c { animation: none; opacity: 1; }
    }
  </style>

  <rect width="1200" height="176" rx="14" fill="url(#ticker-bg)" />
  <rect x="0.5" y="0.5" width="1199" height="175" rx="13.5" fill="none" stroke="#30363d" />
  <path d="M 26 58 H 1174 M 26 116 H 1174" stroke="#ffffff" stroke-opacity="0.07" />

  <g class="mono" font-size="14" letter-spacing="2.1">
    <g class="row-a" fill="#f1f1f1" text-anchor="middle">
      <text x="600" y="37">TYPESCRIPT · REACT · NEXT.JS · NODE.JS · POSTGRESQL · SUPABASE · DOCKER</text>
    </g>
    <g class="row-b" fill="#8e9295" text-anchor="middle">
      <text x="600" y="95">C++ · X86-64 ASM · WINDOWS API · CMAKE · DIRECTX · IMGUI · PYTHON · NATIVE SYSTEMS</text>
    </g>
    <g class="row-c" fill="#f1f1f1" text-anchor="middle">
      <text x="600" y="153">X64DBG · IDA · GHIDRA · CHEAT ENGINE · WINDBG · FRIDA · RUNTIME ANALYSIS · GAME SECURITY</text>
    </g>
  </g>
</svg>
