<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="122" viewBox="0 0 1200 122" role="img" aria-labelledby="title description">
  <title id="title">Technology and engineering ticker</title>
  <desc id="description">Two animated rows listing Nick's product technologies and engineering domains.</desc>

  <defs>
    <linearGradient id="ticker-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070809" />
      <stop offset="0.5" stop-color="#0b0c0d" />
      <stop offset="1" stop-color="#070809" />
    </linearGradient>
    <clipPath id="ticker-clip">
      <rect x="1" y="1" width="1198" height="120" rx="13" />
    </clipPath>
    <linearGradient id="edge-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070809" />
      <stop offset="1" stop-color="#070809" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="edge-right" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#070809" />
      <stop offset="1" stop-color="#070809" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .forward { animation: forward 24s linear infinite; }
    .reverse { animation: reverse 28s linear infinite; }
    @keyframes forward { to { transform: translateX(-1200px); } }
    @keyframes reverse { from { transform: translateX(-1200px); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .forward, .reverse { animation: none; }
    }
  </style>

  <rect width="1200" height="122" rx="14" fill="url(#ticker-bg)" />
  <rect x="0.5" y="0.5" width="1199" height="121" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" />
  <path d="M 26 61 H 1174" stroke="#ffffff" stroke-opacity="0.07" />

  <g clip-path="url(#ticker-clip)" class="mono" font-size="15" letter-spacing="2.1">
    <g class="forward" fill="#f1f1f1">
      <text x="42" y="39">TYPESCRIPT · REACT · NEXT.JS · NODE.JS · POSTGRESQL · SUPABASE · DOCKER ·</text>
      <text x="1242" y="39">TYPESCRIPT · REACT · NEXT.JS · NODE.JS · POSTGRESQL · SUPABASE · DOCKER ·</text>
    </g>
    <g class="reverse" fill="#8e9295">
      <text x="42" y="93">C++ · PYTHON · NATIVE SYSTEMS · REVERSE ENGINEERING · APPLICATION SECURITY · AUTOMATION ·</text>
      <text x="1242" y="93">C++ · PYTHON · NATIVE SYSTEMS · REVERSE ENGINEERING · APPLICATION SECURITY · AUTOMATION ·</text>
    </g>
  </g>

  <rect x="1" y="1" width="88" height="120" rx="13" fill="url(#edge-left)" />
  <rect x="1111" y="1" width="88" height="120" rx="13" fill="url(#edge-right)" />
</svg>
